[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniblog-agent"
version = "0.1.0"
description = "Autonomous Multi-Agent Enterprise Blog & Content Publication Engine powered by Google ADK on GCP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "OmniBlog Team", email = "bobbymatthews@google.com"}
]
keywords = [
    "google-cloud",
    "vertex-ai",
    "adk",
    "agent-development-kit",
    "gemini",
    "llm",
    "multi-agent",
    "seo",
    "blog-automation"
]
dependencies = [
    "google-adk>=2.12.0",
    "google-adk[db]>=2.12.0",
    "google-genai>=2.33.0",
    "google-cloud-trace>=1.21.0",
    "google-cloud-storage>=3.17.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "black>=24.8.0"
]

[project.scripts]
omniblog = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "agent*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
